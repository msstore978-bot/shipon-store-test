name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build Shipon Store Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Check project files
      - name: Check project
        run: |
          echo "Node version:"
          node --version
          echo "NPM version:"
          npm --version
          echo "Project files:"
          ls -la

      # 5. Install dependencies
      - name: Install npm dependencies
        run: npm install

      # 6. Build web application
      - name: Build web application
        run: npm run build

      # 7. Add Android platform
      - name: Add Android platform
        run: npx cap add android

      # 8. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 9. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 10. Build Debug APK
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 11. Check APK
      - name: Check APK
        run: |
          echo "APK files:"
          ls -lh android/app/build/outputs/apk/debug/

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shipon-store-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
