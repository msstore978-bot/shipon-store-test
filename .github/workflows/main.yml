name: Shipon Store APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Install dependencies
      - name: Install npm dependencies
        run: npm install

      # 5. Build web application
      - name: Build web application
        run: npm run build

      # 6. Create Android project
      - name: Add Android platform
        run: npx cap add android

      # 7. Sync Capacitor
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 8. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 9. Build Debug APK
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 10. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shipon-store-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 11. Upload mapping/build information if available
      - name: Build summary
        run: |
          echo "======================================"
          echo "Shipon Store APK build completed"
          echo "======================================"
          ls -lh android/app/build/outputs/apk/debug/
